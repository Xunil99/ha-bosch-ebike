name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few quick details up
        front usually save a round trip of "can you also tell me...".

  - type: checkboxes
    id: existing
    attributes:
      label: Is there an existing issue for this?
      description: >-
        A quick search of open **and closed** issues, especially for
        recurring topics like Bosch ride-mode codes showing as a raw code
        instead of a name.
      options:
        - label: I searched and didn't find an existing issue for this
          required: true

  - type: dropdown
    id: component
    attributes:
      label: What does this affect?
      options:
        - Home Assistant integration (custom_components/ha_bosch_ebike)
        - Lovelace card (map / calendar / heatmap / stats / dashboard / 3D map / trick list / route planner)
        - LDI bridge firmware (single-bike)
        - LDI bridge firmware (dual-bike)
        - Charge Limiter firmware
        - Cockpit display firmware
        - Something else / not sure
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: Which Bosch system is your bike?
      description: Only applies to integration/card issues - leave as N/A for a firmware-only report.
      options:
        - Smart System
        - eBike System 2 (BES2)
        - Not applicable / not sure
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Settings → Devices & Services → Bosch eBike → the version shown on the card.
      placeholder: e.g. 1.19.41
    validations:
      required: false

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.4
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        If you're attaching a debug log or a diagnostics export, please
        double-check it for tokens/serial numbers first - the integration's
        own diagnostics export redacts the fields it knows about, but a
        raw debug log does not.
      render: shell
    validations:
      required: false
