name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The suite under tests/ is deliberately dependency-free: every file is
      # a plain script that imports the module under test via importlib and
      # asserts, so there is nothing to install and no test runner needed.
      # It only covers the pure helper modules (no Home Assistant imports).
      - name: Python tests
        run: |
          set -euo pipefail
          failed=0
          for f in tests/test_*.py; do
            echo "--- $f"
            python3 "$f" || failed=1
          done
          exit $failed

      # Guards the seven card translations against the mistakes that are easy
      # to make by hand: a missing or renamed key, a language block drifting
      # out of order, or a ${placeholder} lost while translating a
      # function-valued string.
      - name: Card translation structure
        run: node tests/check_card_i18n.mjs
